[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gpu-debugger"
version = "0.1.0"
description = "Evidence-driven CUDA debugging with isolated candidate verification"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2,<3", "typer>=0.16,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[project.scripts]
gpu-agent = "gpu_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "gpu: requires a real CUDA GPU",
  "container: requires the isolated GPU container backend",
  "live_llm: requires a real configured model provider",
  "release: required release acceptance evidence",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

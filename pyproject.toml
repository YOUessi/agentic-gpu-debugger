[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gpu-debugger"
version = "0.2.0"
description = "Evidence-driven CUDA debugging with isolated candidate verification"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Agentic GPU Debugger contributors" }]
keywords = ["cuda", "debugging", "gpu", "compute-sanitizer", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "pydantic>=2,<3", "typer>=0.16,<1", "httpx==0.28.1",
  "beautifulsoup4==4.13.5", "packaging==25.0",
  "openai>=3.13.0,<4",
]

[project.urls]
Homepage = "https://github.com/YOUessi/agentic-gpu-debugger"
Repository = "https://github.com/YOUessi/agentic-gpu-debugger.git"
Issues = "https://github.com/YOUessi/agentic-gpu-debugger/issues"
Changelog = "https://github.com/YOUessi/agentic-gpu-debugger/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "setuptools>=77", "pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[project.scripts]
gpu-agent = "gpu_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_agent = ["execution/trusted_sources.json"]

[tool.setuptools.data-files]
"share/agentic-gpu-debugger/benchmarks/diverse_clean/stencil2d" = ["benchmarks/diverse_clean/stencil2d/kernel.cu"]
"share/agentic-gpu-debugger/benchmarks/diverse_clean/segment_scan" = ["benchmarks/diverse_clean/segment_scan/kernel.cu"]
"share/agentic-gpu-debugger/benchmarks/public/case_0021/public_input" = ["benchmarks/public/case_0021/public_input/kernel.cu", "benchmarks/public/case_0021/public_input/input.json", "benchmarks/public/case_0021/public_input/task.json"]
"share/agentic-gpu-debugger/benchmarks/public/case_0022/public_input" = ["benchmarks/public/case_0022/public_input/kernel.cu", "benchmarks/public/case_0022/public_input/input.json", "benchmarks/public/case_0022/public_input/task.json"]

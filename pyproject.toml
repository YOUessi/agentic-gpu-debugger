[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test this checkout, never an editable install that points elsewhere.
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "gpu: requires a real CUDA GPU",
  "container: requires the isolated GPU container backend",
  "live_llm: requires a real configured model provider",
  "release: required release acceptance evidence",
  "release_evidence: fixed positive evidence selected by the release controller",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

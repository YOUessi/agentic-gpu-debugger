name: HardSet V2 native-contract validation

on:
  pull_request:
    paths:
      - "scripts/generate_hardset_v2.py"
      - "src/gpu_agent/benchmark/hardset_v2.py"
      - "src/gpu_agent/benchmark/hardset_v2_probe.py"
      - "src/gpu_agent/benchmark/hardset_v2_graph.py"
      - "src/gpu_agent/agent/prompts.py"
      - "src/gpu_agent/agent/provider.py"
      - "src/gpu_agent/benchmark/hardset_v2_verifier.py"
      - "src/gpu_agent/benchmark/hardset_v2_agent.py"
      - "src/gpu_agent/harness/**"
      - "src/gpu_agent/benchmark/hardset_v2_agent_models.py"
      - "src/gpu_agent/benchmark/hardset_v2_selfcheck.py"
      - "src/gpu_agent/cli.py"
      - "tests/unit/test_hardset_v2.py"
      - "tests/unit/test_hardset_v2_probe.py"
      - "tests/unit/test_hardset_v2_llm.py"
      - "tests/unit/test_hardset_v2_autonomous.py"
      - "tests/unit/test_hardset_v2_autonomous_wire.py"
      - "tests/unit/test_gpu_coding_harness.py"
      - "tests/unit/test_gpu_harness_runtime.py"
      - "tests/unit/test_gpu_harness_worktree.py"
      - "tests/unit/test_gpu_harness_repo_agent.py"
      - "tests/unit/test_gpu_harness_checkpoint.py"
      - "docs/research/LANGGRAPH_HARNESS_WORKTREE_CHECKPOINT_V3_CN.md"
      - "benchmarks/hardset_v2/**"
      - "docs/research/HARDSET_V2_NATIVE_CN.md"
      - "docs/research/HARDSET_V2_PROBE_AND_STRICT_CN.md"
      - "docs/research/HARDSET_V2_LLM_PLANNER_CN.md"
      - "docs/research/HARDSET_V2_AUTONOMOUS_AGENT_CN.md"
      - "docs/research/GPU_CODING_HARNESS_ARCHITECTURE_CN.md"
      - "docs/research/LANGGRAPH_SELF_HOSTED_HARNESS_V2_CN.md"
      - ".github/workflows/hardset-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-hardset:
    name: HardSet V2 source hashes, CPU oracles and bounded inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install frozen runtime without GPU or API
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Fixture hash and generator reproducibility
        run: python scripts/generate_hardset_v2.py --verify
      - name: Lint, format and test reference semantics
        run: |
          python -m ruff check scripts/generate_hardset_v2.py src/gpu_agent/benchmark/hardset_v2.py src/gpu_agent/benchmark/hardset_v2_probe.py src/gpu_agent/benchmark/hardset_v2_graph.py src/gpu_agent/benchmark/hardset_v2_verifier.py src/gpu_agent/cli.py tests/unit/test_hardset_v2.py tests/unit/test_hardset_v2_probe.py
          python -m ruff format --check scripts/generate_hardset_v2.py src/gpu_agent/benchmark/hardset_v2.py src/gpu_agent/benchmark/hardset_v2_probe.py src/gpu_agent/benchmark/hardset_v2_graph.py src/gpu_agent/benchmark/hardset_v2_verifier.py src/gpu_agent/cli.py tests/unit/test_hardset_v2.py tests/unit/test_hardset_v2_probe.py
          python -m pytest -q tests/unit/test_hardset_v2.py tests/unit/test_hardset_v2_probe.py tests/unit/test_hardset_v2_llm.py tests/unit/test_hardset_v2_autonomous.py tests/unit/test_hardset_v2_autonomous_wire.py tests/unit/test_gpu_coding_harness.py tests/unit/test_gpu_harness_runtime.py tests/unit/test_gpu_harness_worktree.py tests/unit/test_gpu_harness_repo_agent.py tests/unit/test_gpu_harness_checkpoint.py
      - name: Declare test scope
        run: echo 'Offline CPU contract only. Not real GPU, Agent repair, hidden evaluation, or release evidence.'
